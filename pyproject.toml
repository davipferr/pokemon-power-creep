[project]
name = "pokemon-power-creep"
version = "0.1.0"
description = "Build-time data pipeline (PokeAPI) for an Observable Framework site about Pokémon power creep"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "polars>=1.10",
    "pyarrow>=26.0.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
